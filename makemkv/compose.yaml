networks:
  nginx-proxy-manager:
    external: true

services:
  makemkv:
    image: jlesage/makemkv
    networks:
      - nginx-proxy-manager
    volumes:
      - "./config:/config:rw"
      # - "/home/user:/storage:ro"
      - "/mnt/storage0/ripping/watch:/output:rw"
    devices:
      - "/dev/sr0:/dev/sr0"
      - "/dev/sg7:/dev/sg7"
    env_file:
      - .env
    environment:
      - USER_ID=${PUID:-950}
      - GROUP_ID=${PGID:-950}
      - TZ=${TZ:-Europe/Madrid}
      - MAKEMKV_GUI=0
      - AUTO_DISC_RIPPER=1
      - AUTO_DISC_RIPPER_EJECT=1
      - AUTO_DISC_RIPPER_MIN_TITLE_LENGTH=300
    restart: unless-stopped
    labels:
      glance.name: MakeMKV
      glance.icon: si:discogs
      glance.url: https://makemkv.kamaji.gerardgascon.com
      glance.description: DVD/BluRay ripping
      glance.category: services
      glance.hide: false
      glance.id: makemkv