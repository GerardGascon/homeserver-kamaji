networks:
  nginx-proxy-manager:
    external: true

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=950
      - PGID=3000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - /mnt/storage1/media:/data/media
      - /mnt/storage0/downloads/qbittorrent/completed:/downloads/completed
    networks:
      - nginx-proxy-manager
    labels:
      glance.name: Bazarr
      glance.icon: si:sonarr
      glance.description: Subtitle Collection Manager
      glance.url: https://bazarr.kamaji.gerardgascon.com
      glance.category: arr-stack
      glance.hide: false
      glance.id: bazarr