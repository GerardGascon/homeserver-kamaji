networks:
  nginx-proxy-manager:
    external: true

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - nginx-proxy-manager
    environment:
      - PUID=${PUID:-950}
      - PGID=${PGID:-950}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
    restart: unless-stopped
    labels:
      glance.name: Prowlarr
      glance.icon: si:bittorrent
      glance.description: Indexer Manager
      glance.url: https://prowlarr.kamaji.gerardgascon.com
      glance.category: arr-stack
      glance.hide: false
      glance.id: prowlarr